name: Publish VidOtter desktop release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  archives:
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pinned FFmpeg Whisper llama runtime payload from prior release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .build/base
          # Resolve the most recent *published* release; no old tag is pinned,
          # so deleting superseded Releases does not break future builds.
          previous_tag=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          test -n "$previous_tag"
          test "$previous_tag" != "$GITHUB_REF_NAME"
          previous_archive="vidotter-${previous_tag}-windows-amd64.zip"
          gh release download "$previous_tag" -R "$GITHUB_REPOSITORY" -p "$previous_archive" -p SHA256SUMS.txt -p FFmpeg-n8.1.2-source.tar.gz -D .build/base
          (cd .build/base && sha256sum -c SHA256SUMS.txt --ignore-missing)
          PREVIOUS_TAG="$previous_tag" python -c 'import os,zipfile; tag=os.environ["PREVIOUS_TAG"]; zipfile.ZipFile(f".build/base/vidotter-{tag}-windows-amd64.zip").extractall(".build/base/extracted")'
          mkdir -p dist/tools .build/cache/source
          cp -a ".build/base/extracted/vidotter-${previous_tag}-windows-amd64/tools/." dist/tools/
          cp .build/base/FFmpeg-n8.1.2-source.tar.gz .build/cache/source/
          test -s dist/tools/ffmpeg-slim.exe
          test -s dist/tools/whisper/whisper-cli.exe
          test -s dist/tools/llama/llama-server.exe
      - name: Build current VidOtter binaries and five verified portable archives
        shell: bash
        run: |
          set -euo pipefail
          test "v$(python -c 'import json;print(json.load(open("extension/manifest.json"))["version"])')" = "$GITHUB_REF_NAME"
          go -C tools/vidotterdev run . package --version "$GITHUB_REF_NAME"
          test -s ".build/artifacts/release/$GITHUB_REF_NAME/vidotter-$GITHUB_REF_NAME-windows-amd64.zip"
          (cd ".build/artifacts/release/$GITHUB_REF_NAME" && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: portable-archives
          path: .build/artifacts/release/${{ github.ref_name }}/*
          if-no-files-found: error
  installers:
    needs: archives
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            slug: linux-amd64
          - os: windows-2025
            slug: windows-amd64
          - os: macos-15-intel
            slug: macos-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Qt IFW build-tool downloader
        run: python -m pip install --disable-pip-version-check aqtinstall==3.3.0
      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xkb1 libxcb-util1 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0
      - uses: actions/download-artifact@v4
        with:
          name: portable-archives
          path: dist/release
      - name: Build native installer from verified archive
        shell: bash
        run: |
          python scripts/build-offline-installer.py --tag "$GITHUB_REF_NAME" --tools-root "$RUNNER_TEMP/qtifw" --working-dir "$RUNNER_TEMP/work" --output-dir dist/installer --local-release-dir dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.slug }}
          path: dist/installer/VidOtter-Setup-*
          if-no-files-found: error
  publish:
    needs: installers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: portable-archives
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: dist
      - name: Verify and publish desktop release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS.txt
          for target in windows-amd64.exe linux-amd64.run macos-amd64.dmg; do
            test -s "VidOtter-Setup-$GITHUB_REF_NAME-$target"
          done
          sha256sum VidOtter-Setup-* > INSTALLER-SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" ./* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "VidOtter $GITHUB_REF_NAME"
