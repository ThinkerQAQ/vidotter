name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            bridge/go.sum
            tools/vidotterdev/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate README-Only documentation and links
        run: python scripts/check-readme-links.py
      - run: go -C tools/vidotterdev run . verify
      - run: go -C tools/vidotterdev run . build
      - name: Verify Unix MCP setup syntax
        if: runner.os != 'Windows'
        run: bash -n scripts/setup-mcp.sh scripts/manage-mcp.sh scripts/manage-background.sh
      - name: Test Unix Tunnel switching without network
        if: runner.os == 'Linux'
        run: bash scripts/test-mcp-tunnel-switch.sh
      - name: Test Linux background lifecycle in isolated user-service manager
        if: runner.os == 'Linux'
        run: bash scripts/test-background-lifecycle.sh
      - name: Verify Windows MCP setup syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($script in @('scripts/Setup-VidOtter-MCP.ps1', 'scripts/Manage-VidOtter-MCP.ps1', 'scripts/Manage-VidOtter-Background.ps1', 'scripts/test-background-lifecycle.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - name: Test Windows Tunnel replacement and rollback without network
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-mcp-tunnel-switch.ps1
      - name: Test Windows scheduled-task lifecycle using isolated paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-background-lifecycle.ps1
      - name: Verify target dependency licenses
        if: runner.os == 'Linux'
        run: go -C tools/vidotterdev run . licenses
