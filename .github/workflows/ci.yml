name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            bridge/go.sum
            tools/vidotterdev/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: go -C tools/vidotterdev run . verify
      - run: go -C tools/vidotterdev run . build
      - name: Verify Unix MCP setup syntax
        if: runner.os != 'Windows'
        run: bash -n scripts/setup-mcp.sh
      - name: Verify Windows MCP setup syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/Setup-VidOtter-MCP.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Verify target dependency licenses
        if: runner.os == 'Linux'
        run: go -C tools/vidotterdev run . licenses
